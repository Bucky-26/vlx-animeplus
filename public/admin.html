<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnimePlus Admin</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#e5eef8;background:#0b1220}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#18324b,#0b1220 50%)}main{max-width:760px;margin:auto;padding:48px 20px}section{background:#111c2d;border:1px solid #29415d;border-radius:12px;padding:24px;margin-top:20px}h1{margin:0 0 8px}p{color:#9eb1c7}input{width:100%;padding:12px;margin:8px 0 12px;border:1px solid #38526e;border-radius:7px;background:#0b1422;color:#fff}button{padding:10px 14px;border:0;border-radius:7px;background:#38bdf8;color:#062033;font-weight:700;cursor:pointer;margin-right:8px}button.danger{background:#fb7185;color:#310812}li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #24364c;word-break:break-all}.hidden{display:none}.message{min-height:24px;color:#fbbf24}
  </style>
</head>
<body><main>
  <h1>VLX AnimePlus</h1><p>Manage the origins allowed to call the anime API.</p>
  <section id="login"><h2>Admin sign in</h2><input id="email" type="email" placeholder="Supabase account email"><input id="password" type="password" placeholder="Supabase account password"><button id="loginButton">Sign in</button><div id="loginMessage" class="message"></div></section>
  <section id="dashboard" class="hidden"><button id="logoutButton">Sign out</button><h2>Allowed origins</h2><p>Use complete origins such as https://anime.example.com.</p><input id="origin" placeholder="https://example.com"><button id="addButton">Add origin</button><div id="message" class="message"></div><ul id="origins"></ul></section>
<script>
const login=document.querySelector('#login'), dashboard=document.querySelector('#dashboard'), message=document.querySelector('#message'), origins=document.querySelector('#origins');
async function api(url, options={}){const response=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');return data;}
async function load(){try{const me=await api('/admin/api/me');if(me.authenticated){login.classList.add('hidden');dashboard.classList.remove('hidden');const data=await api('/admin/api/origins');origins.innerHTML=data.origins.map(origin=>`<li><span>${origin}</span><button class="danger" data-origin="${origin}">Remove</button></li>`).join('')||'<li>No origins yet.</li>';}}catch(error){message.textContent=error.message;}}
document.querySelector('#loginButton').onclick=async()=>{try{await api('/admin/api/login',{method:'POST',body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});location.reload();}catch(error){document.querySelector('#loginMessage').textContent=error.message;}};
document.querySelector('#addButton').onclick=async()=>{try{await api('/admin/api/origins',{method:'POST',body:JSON.stringify({origin:document.querySelector('#origin').value})});document.querySelector('#origin').value='';await load();}catch(error){message.textContent=error.message;}};
origins.onclick=async event=>{if(event.target.dataset.origin){try{await api('/admin/api/origins',{method:'DELETE',body:JSON.stringify({origin:event.target.dataset.origin})});await load();}catch(error){message.textContent=error.message;}}};
document.querySelector('#logoutButton').onclick=async()=>{await api('/admin/api/logout',{method:'POST'});location.reload();};load();
</script></main></body></html>
